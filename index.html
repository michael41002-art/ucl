<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניחושי הצמרת</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A24" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ניחושים">
<style>html,body{margin:0;height:100%;background:#F3F5F8;color:#0B1220;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}@media (prefers-color-scheme: dark){html,body{background:#0B0F17;color:#E9EEF6}}.s{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.s img{width:88px;height:88px;border-radius:22px}.s p{margin:0;opacity:.7}.s button{display:none;background:#2E5BFF;color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600}</style>
</head>
<body>
<div class="s"><img src="icon-192.png" alt=""><p id="m">טוען…</p><button id="r" type="button" onclick="location.reload()">נסו שוב</button></div>
<script>
var APP="https://script.google.com/macros/s/AKfycbyyBcBzjWO62UXWzQO_rAGViSNII3fQU-HK7u7IL0npJN86XAguAy8xHydLehCyneUJ/exec?file=app";
function show(h){document.open();document.write(h);document.close();}
var C=null;try{C=localStorage.getItem("ucl-app")}catch(e){}
var F=fetch(APP).then(function(r){if(!r.ok)throw new Error("http");return r.text();}).then(function(h){try{localStorage.setItem("ucl-app",h)}catch(e){}if(C&&h!==C){window.__appNew=true;if(window.appUpdated)window.appUpdated();}return h;});
if(C){show(C);}else{F.then(show).catch(function(){document.getElementById("m").textContent="אין חיבור לאינטרנט";document.getElementById("r").style.display="block";});}
</script>
</body>
</html>
