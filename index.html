<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניחושי ליגת האלופות</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1A30">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ניחושים">
<style>html,body{margin:0;height:100%;background:#0D1A30;color:#F2F5FB;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.s{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.s img{width:96px;height:96px;border-radius:22px}.s p{margin:0;opacity:.75}.s button{display:none;background:#7D9BFF;color:#081127;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600}</style>
</head>
<body>
<div class="s"><img src="icon-192.png" alt=""><p id="m">טוען…</p><button id="r" type="button" onclick="location.reload()">נסו שוב</button></div>
<script>
var APP="https://script.google.com/macros/s/AKfycbyyBcBzjWO62UXWzQO_rAGViSNII3fQU-HK7u7IL0npJN86XAguAy8xHydLehCyneUJ/exec?file=app";
function show(h){document.open();document.write(h);document.close();}
fetch(APP).then(function(r){if(!r.ok)throw new Error("http");return r.text();}).then(function(h){try{localStorage.setItem("ucl-app",h)}catch(e){}show(h);}).catch(function(){var h=null;try{h=localStorage.getItem("ucl-app")}catch(e){}if(h){show(h);}else{document.getElementById("m").textContent="אין חיבור לאינטרנט";document.getElementById("r").style.display="block";}});
</script>
</body>
</html>
